name: Build merged TV guide
# Four times a day (the first just after JioTV's own nightly rebuild, about 04:15 UTC) and on demand.
# build_epg.py merges the public guide files into one small epg.xml.gz for the Live TV app; if it finds too
# few channels it fails and the published file stays the last good one.
on:
  schedule:
    - cron: '45 4 * * *'
    - cron: '30 10 * * *'
    - cron: '30 16 * * *'
    - cron: '30 22 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: epg
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 build_epg.py epg.xml.gz
      - name: Publish on the epg-data branch (a single commit, replaced every time, so no history grows)
        run: |
          mkdir /tmp/pub && cp epg.xml.gz /tmp/pub/ && cd /tmp/pub
          git init -q -b epg-data
          git config user.name "epg-bot"
          git config user.email "epg-bot@users.noreply.github.com"
          git add epg.xml.gz
          git commit -q -m "Merged guide $(date -u '+%F %H:%M') UTC"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" epg-data
